<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Opal + Flow 本地助手</title><link rel="stylesheet" href="popup.css"></head><body>
<header><span>本地保存 · 无需表格授权</span><h1>Opal + Flow</h1><button id="library">打开我的提示词</button><div id="stats">正在读取本地数据…</div></header>
<section><h2>Opal · 提示词与图片</h2><div class="row"><label for="mode">运行方式</label><select id="mode"><option value="monitor">监控模式</option><option value="auto">全自动循环</option></select></div><div class="opal-options"><label><input type="checkbox" id="saveImages" checked> 启用图片下载</label><label><input type="checkbox" id="savePrompts" checked> 上传提示词（保存到本地）</label><label><input type="checkbox" id="autoDownload" checked> 自动下载图片</label><small>图片与提示词可独立选择。关闭自动下载后，点击手动选择。</small><button id="pickImages" class="secondary" hidden>手动选择图片下载</button></div><div class="buttons"><button id="opalToggle">开始 Opal</button><button id="manual" class="secondary">提取当前页</button></div><p id="opalState">已停止</p><small>监控模式等待结果；全自动模式会点击刷新和 Start。设置只作用于当前页面，浏览器会话结束后清除。</small></section>
<section><h2>Flow · 自动生图</h2><div class="row"><label for="concurrency">每页同时处理的提示词数</label><input id="concurrency" disabled title="每个网页固定一次处理一条提示词" type="number" min="1" max="1" step="1" value="1" style="width:72px"></div><small>每次提交为一个任务；每条生成多张时，任意一张成功即记成功。</small><button id="flowToggle">开始当前 Flow 页面</button><p id="flowState">请在 Flow 项目页面打开插件。</p><small>按 Flow 页面当前的图片设置生成。队列为空时等待新提示词；停止后会先完成当前任务的回写。</small><button id="stopAll" class="secondary">停止所有 Flow 页面</button></section>
<div id="notice" role="status" aria-live="polite"></div><footer>Opal 与 Flow 可同时运行，开始和停止互相独立。</footer><script src="popup.js"></script></body></html>
